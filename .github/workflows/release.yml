name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    concurrency:
      group: flowquery-release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts..."
          ls -la dist/flowquery.min.js || echo "dist/flowquery.min.js not found"

      - name: Copy to VS Code extension
        run: |
          echo "Copying flowquery.min.js to VS Code extension..."
          mkdir -p flowquery-vscode/flowQueryEngine
          cp dist/flowquery.min.js flowquery-vscode/flowQueryEngine/
          ls -la flowquery-vscode/flowQueryEngine/

      - name: Bump version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump patch version (use 'minor' or 'major' for other bump types)
          npm version patch --no-git-tag-version

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT

          # Sync VS Code extension version
          cd flowquery-vscode
          npm version "${NEW_VERSION}" --no-git-tag-version
          cd ..

          # Commit the version bump
          git add package.json package-lock.json flowquery-vscode/package.json
          git commit --no-verify -m "chore: bump version to ${NEW_VERSION} [skip ci]"

          # Include any changes from formatters/linters in the commit
          git add -A
          git diff --cached --quiet || git commit --amend --no-verify --no-edit

          # Retry the rebase/push sequence in case another workflow updates main first.
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main

            if ! git rebase origin/main; then
              git rebase --abort || true
            elif git push origin HEAD:main; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to push version bump after 3 attempts."
              exit 1
            fi

            sleep 5
          done

      - name: Package TypeScript library
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Python library
        id: python_package
        run: |
          python -m pip install build
          python -m build --outdir release-assets flowquery-py
          PYTHON_VERSION=$(python -c "import sys; tomllib = __import__('tomllib' if sys.version_info >= (3, 11) else 'tomli'); print(tomllib.load(open('flowquery-py/pyproject.toml', 'rb'))['project']['version'])")
          echo "version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify local package installation
        run: |
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/flowquery-npm-install" ./release-assets/*.tgz
          python -m pip install --no-deps --target "$RUNNER_TEMP/flowquery-python-wheel-install" ./release-assets/*.whl
          python -m pip install --no-deps --target "$RUNNER_TEMP/flowquery-python-sdist-install" ./release-assets/*.tar.gz
          ls -la release-assets

      - name: Install VS Code extension dependencies
        working-directory: ./flowquery-vscode
        run: |
          npm install @vscode/vsce

      - name: Package VS Code extension
        working-directory: ./flowquery-vscode
        run: |
          npx @vscode/vsce package
          ls -la *.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Automated release from main branch
            Version: ${{ steps.version.outputs.version }}
            Python package version: ${{ steps.python_package.outputs.version }}
            Commit: ${{ github.sha }}

            Install the downloaded library packages from local files:
            - Node.js/TypeScript: `npm install ./flowquery-${{ steps.version.outputs.version }}.tgz`
            - Python wheel: `pip install ./flowquery-${{ steps.python_package.outputs.version }}-py3-none-any.whl`
            - Python source archive: `pip install ./flowquery-${{ steps.python_package.outputs.version }}.tar.gz`
          files: |
            dist/flowquery.min.js
            flowquery-vscode/*.vsix
            release-assets/*
          draft: false
          prerelease: false
